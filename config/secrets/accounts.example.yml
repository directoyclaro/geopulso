# Copia este archivo como config/secrets/accounts.yml y rellena tus cuentas quemables.
# NUNCA subas accounts.yml al repositorio (esta en .gitignore).
#
# Instagram:
#   - Si el login por usuario/clave falla con "version out of date", usa 'sessionid':
#     entra a instagram.com en el navegador, abre DevTools > Application > Cookies,
#     copia el valor de la cookie 'sessionid' y pegalo aqui.
#   - session_file: cache de la sesion (se genera sola).
#
# Facebook:
#   - Si no hay cookies, el colector intenta login con usuario/clave via navegador.
#   - Alternativamente guarda las cookies exportadas (lista JSON) o un storage_state
#     de Playwright en 'session_file'.

instagram:
  - username: "cuenta_ig_1"
    password: "clave_ig_1"
    sessionid: ""
    session_file: "ig_cuenta_ig_1.json"

facebook:
  - username: "cuenta_fb_1"
    password: "clave_fb_1"
    session_file: "fb_cuenta_fb_1.json"
